name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-android-apk.yml'
      - 'src/**'
      - 'assets/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Verify app
        run: |
          npm run typecheck
          npm test

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build installable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk PawfectPerth-v1.0.0.apk
          sha256sum PawfectPerth-v1.0.0.apk > PawfectPerth-v1.0.0.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PawfectPerth-Android-APK
          path: |
            PawfectPerth-v1.0.0.apk
            PawfectPerth-v1.0.0.apk.sha256
          retention-days: 30
          if-no-files-found: error
